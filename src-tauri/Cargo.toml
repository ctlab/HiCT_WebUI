[package]
name = "hict-tauri-browser"
version = "0.1.1"
description = "Small Tauri WebView wrapper for the local HiCT WebUI"
authors = ["Computer Technologies Laboratory ITMO University team"]
license = "MIT"
repository = "https://github.com/ctlab/HiCT_WebUI"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_16"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSSet", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
